ка скопирована")}}catch(e){}}s.innerHTML='<div class="art">🔎</div><small>СЕКРЕТНОЕ АГЕНТСТВО</small><h1>Правда или фейк?</h1><div style="display:flex;gap:16px;align-items:center;margin:20px 0;padding:16px;background:#203452;border-radius:18px"><div style="font-size:42px" aria-hidden="true">🔎</div><div><strong>Автор проекта — Аня</strong><br><small>Помощники: папа и ChatGPT</small><br><small>Домашнее задание № 2 · Zerocoder · НЕЙРОтин</small></div></div><p>Десять удивительных новостей. Пять настоящих и пять вымышленных. Сможешь разоблачить все фейки?</p><button onclick="start()">Начать расследование →</button>';</script></html>
